# fly.toml app configuration file generated for oralcare on 2025-04-05T02:05:46+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oralcare'
primary_region = 'fra'

[build]

[processes]
  app = "node src/index.js"
  
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
