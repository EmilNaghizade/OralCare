# fly.toml app configuration file generated for oralcare on 2025-04-05T02:05:46+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oralcare'
primary_region = 'fra'

[build]

[mounts]
  source = "oralcare_data"
  destination = "/app/src/uploads"
  initial_size = "10gb"

[processes]
  app = "node src/index.js"
  
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  concurrency = {type= "connections" , soft_limit = 200,  hard_limit = 250 }
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.check]
  interval = "10s"
  timeout = "5s"
  grace_period = "5s"
  method = "get"
  path = "/health"
  protocol = "http"


[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
